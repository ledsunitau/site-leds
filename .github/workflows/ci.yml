name: CI

on:
  pull_request:
  push:
    branches: [ main ]

# Um push novo cancela a execução anterior da MESMA ref. Sem isto, uma run
# pendurada (ex.: apt travado num mirror ruim) segue ocupando a fila e
# bloqueando o merge mesmo depois de o commit seguinte já ter subido.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan_ruby:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager

      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit

  scan_js:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for security vulnerabilities in JavaScript dependencies
        run: bin/importmap audit

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@v4
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  test:
    runs-on: ubuntu-latest
    # A suíte roda em ~30s; 15 min é folga grande e ainda assim MUITO abaixo do
    # teto padrão do GitHub (6 h), que foi o que deixou um apt pendurado queimar
    # uma tarde inteira sem dar sinal nenhum.
    timeout-minutes: 15

    # Testes rodam contra Postgres real: CHECK constraints e triggers do
    # schema (structure.sql) não existem em nenhum outro banco.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      # psql é OBRIGATÓRIO: o db:test:prepare com schema_format = :sql carrega o
      # structure.sql por ele. libvips é opcional — ruby-vips é `require: false`
      # justamente para o app subir sem ele (ver comentário no Gemfile); sem
      # libvips o Active Storage só deixa de gerar variante, e nenhum teste gera.
      #
      # O runner resolve os repositórios por uma MIRRORLIST
      # (/etc/apt/apt-mirrors.txt) que põe azure.archive.ubuntu.com em primeiro.
      # Quando esse mirror não responde, cada retry do apt insiste nele antes de
      # cair no archive.ubuntu.com — retry aqui ATRASA o failover em vez de
      # ajudar. Por isso: mirror bom fixado na lista, Retries=1 e, antes de
      # tudo, nem tocar na rede se as ferramentas já vieram na imagem.
      - name: Install packages
        timeout-minutes: 6
        env:
          APT_OPTS: >-
            -o Acquire::Retries=1
            -o Acquire::http::Timeout=10
            -o Acquire::https::Timeout=10
        run: |
          set -u

          faltando=""
          command -v psql >/dev/null || faltando="postgresql-client"
          ldconfig -p | grep -q libvips || faltando="${faltando} libvips"

          if [ -z "${faltando# }" ]; then
            echo "psql e libvips já vieram na imagem do runner — apt não é necessário"
            exit 0
          fi
          echo "instalando:${faltando}"

          # Só o mirror que responde. O arquivo é específico do runner; noutro
          # ambiente o if é falso e a configuração original fica intacta.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            echo "http://archive.ubuntu.com/ubuntu/" | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi

          # shellcheck disable=SC2086 -- listas de opções/pacotes, split proposital
          if sudo apt-get update $APT_OPTS &&
             sudo apt-get install --no-install-recommends -y $APT_OPTS $faltando; then
            exit 0
          fi

          # O apt falhou. Só é fatal se faltar o que a suíte REALMENTE precisa:
          # sem psql o db:test:prepare não carrega o structure.sql. Sem libvips
          # o Active Storage apenas não gera variante — e nenhum teste gera.
          if command -v psql >/dev/null; then
            echo "::warning::apt indisponível; seguindo sem libvips (ruby-vips é require:false)"
            exit 0
          fi
          echo "::error::apt falhou e não há psql — o db:test:prepare precisa dele para o structure.sql"
          exit 1

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Run tests
        env:
          RAILS_ENV: test
        run: bin/rails db:test:prepare test
