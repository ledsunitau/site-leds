# Ambiente de DESENVOLVIMENTO LOCAL: `docker compose up` sobe Postgres + Rails.
#
# Este arquivo NUNCA vai para a VPS. O deploy é via Kamal (config/deploy.yml), que
# não lê docker-compose nenhum — ele roda `docker run` direto a partir da imagem.
# O Postgres do serviço `db` abaixo é só o banco de teste da máquina de quem
# desenvolve; em produção o banco é um container externo, já existente na VPS e
# compartilhado com outras aplicações (ver docs/deploy.md §1.1).
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: bash -c "rm -f tmp/pids/server.pid && bin/rails db:prepare && bin/rails server -b 0.0.0.0"
    volumes:
      - .:/rails
      - bundle_cache:/usr/local/bundle
    ports:
      - "3000:3000"
    environment:
      DB_HOST: db
    env_file:
      - path: .env
        required: false
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  bundle_cache:
