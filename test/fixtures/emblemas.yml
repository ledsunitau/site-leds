  efeito: nenhum
  tipo: escalonavel
  peso: 2
  usuarios_count: 1
  cosmetico_gradiente: "#1D84F5,#00C5C5"
  cosmetico_movimento: varredura
  cosmetico_velocidade: 5

# escalonável por MÉTRICA: o rank acompanha as ideias aprovadas
