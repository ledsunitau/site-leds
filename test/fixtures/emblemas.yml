# Emblemas (RF-EMB). usuarios_count é mantido por counter_cache no runtime;
# nas fixtures ele é escrito à mão para casar com emblema_usuarios.yml —
# fixture não passa por callback.

# meta baixa de propósito: users.yml tem contas com posts publicados
primeira_novidade:
  nome: Primeira novidade
  descricao: Publicou a primeira novidade no site.
  icone_svg: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 4h16v16H4z"/></svg>'
  cor: "#00C55B"
  efeito: nenhum
  criterio: novidades_publicadas
  meta: 1
  usuarios_count: 1
  cosmetico_gradiente: "#00C55B,#7CF0B0"
  cosmetico_movimento: fluxo
  cosmetico_velocidade: 5

# meta alta: ninguém das fixtures alcança — serve para testar o "não concede"
veterano:
  discord_sincronizar: true
  discord_role_id: "900000000000000001"
  nome: Veterano
  descricao: Mil dias de conta.
  icone_svg: '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="9"/></svg>'
  cor: "#1D84F5"
  efeito: neon
  criterio: dias_de_conta
  meta: 1000
  usuarios_count: 0
  cosmetico_gradiente: "#1D84F5,#8AC6FF,#1D84F5"
  cosmetico_movimento: varredura
  cosmetico_velocidade: 6

# sem critério: só concessão a dedo ou link
fundador_honorario:
  nome: Fundador honorário
  descricao: Concedido pela presidência.
  icone_svg: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3 7h7l-6 4 2 7-6-4-6 4 2-7-6-4h7z"/></svg>'
  cor: "#FFEE04"
  efeito: brilho
  usuarios_count: 1
  cosmetico_gradiente: "#FFEE04,#FF9B00"
  cosmetico_movimento: pulso
  cosmetico_velocidade: 3

# exclusivo: fica fora do catálogo de quem não tem
convidado_beta:
  nome: Convidado beta
  descricao: Entrou pelo link do beta fechado.
  icone_svg: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="18" height="18" rx="4"/></svg>'
  cor: "#F84A54"
  efeito: arco_iris
  exclusivo: true
  discord_role_id: "999888777666555444"
  usuarios_count: 0
  cosmetico_gradiente: "#F84A54,#B026FF,#1D84F5"
  cosmetico_movimento: fluxo
  cosmetico_velocidade: 4

# desligado: não aparece no catálogo nem é concedido
aposentado:
  nome: Emblema aposentado
  icone_svg: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M2 12h20"/></svg>'
  cor: "#9A9AA2"
  efeito: nenhum
  ativo: false
  usuarios_count: 0

# escalonável por REGISTRO: sobe a cada maratona lançada por link/concessão
